<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>gulhayo.ai Muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
/* Layout: a painted lapis sky (WebGL) lives behind the "sky" sections; marble-plaster "fresco" sections slide over it.
   Hero text left / laurel on a column right; scroll flies the camera through the wreath into a constellation of 14 videos. */
:root{
  --lapis:#1d43c4;      /* sky, page ground */
  --lapis-deep:#13308f; /* footer, nav glass */
  --cloud:#f5f7fc;      /* text on sky */
  --marble:#ece7dd;     /* fresco sections */
  --ink:#1a1d27;        /* text on marble */
  --stone:#6b6a66;      /* secondary text on marble */
  --gold:#d9b25a;       /* laurel, primary action */
  --gold-hi:#f3d98f;
  --cinnabar:#b5342b;   /* the ribbon; used once or twice */
  --rule-sky:rgba(245,247,252,.28);
  --rule-stone:rgba(26,29,39,.16);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --roman:"Forum","Spectral",Georgia,serif;
  --sans:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --gut-l:max(20px, env(safe-area-inset-left, 0px));
  --gut-r:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--lapis)}
body{background:var(--lapis);color:var(--cloud);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}
.fresco :focus-visible{outline-color:var(--cinnabar)}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main,footer{position:relative;z-index:1}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* ---------- nav ---------- */
.nav{position:fixed;z-index:10;top:calc(14px + env(safe-area-inset-top, 0px));left:0;right:0;padding-left:var(--gut-l);padding-right:var(--gut-r);pointer-events:none}
.nav-in{pointer-events:auto;max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px 8px 8px 20px;border-radius:999px;
  background:rgba(19,48,143,.42);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(245,247,252,.16)}
.brand{font:400 24px/1 var(--roman);letter-spacing:.02em;text-decoration:none;margin-right:auto;color:var(--cloud)}
.nav-links{display:flex;gap:22px;font-size:14px}
.nav-links a{text-decoration:none;color:rgba(245,247,252,.82)}
.nav-links a:hover{color:#fff}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(245,247,252,.12)}
.lang button{border:0;background:none;cursor:pointer;font:600 12px/1 var(--sans);padding:7px 10px;border-radius:999px;color:rgba(245,247,252,.75)}
.lang button[aria-pressed="true"]{background:var(--cloud);color:var(--lapis-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:999px;font:500 15px/1 var(--sans);padding:14px 22px;border:1px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn svg{width:17px;height:17px;flex:none}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.ghost{border-color:rgba(245,247,252,.5);color:var(--cloud)}
.btn.ghost:hover{background:rgba(245,247,252,.12)}
.btn.sm{padding:11px 18px;font-size:14px}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;display:flex;align-items:center}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;padding-block:120px 80px}
.hero-copy{display:grid;gap:26px;max-width:36rem}
.hero h1{margin:0;font:300 clamp(44px,6.2vw,92px)/1.02 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.hero .sub{font-size:18px;line-height:1.6;color:rgba(245,247,252,.9);max-width:30rem}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.hero .note{font-size:13px;color:rgba(245,247,252,.72)}
.hero .note b{font-weight:500;color:var(--cloud)}

/* ---------- dive ---------- */
.dive{height:170vh;position:relative}
.dive-line{position:sticky;top:0;height:100vh;display:grid;place-items:center;text-align:center;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.dive-line p{font:300 italic clamp(28px,3.6vw,54px)/1.2 var(--serif);max-width:20em;text-wrap:balance;opacity:0;text-shadow:0 2px 40px rgba(19,48,143,.5)}

/* ---------- constellation ---------- */
.stars{height:280vh;position:relative}
.stars-pin{position:sticky;top:0;height:100vh;overflow:hidden}
#constellation{position:absolute;inset:0;width:100%;height:100%}
.stars-copy{position:absolute;left:0;right:0;top:calc(96px + env(safe-area-inset-top, 0px))}
.stars-copy .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.stars-copy h2{margin:0 0 14px;font:300 clamp(32px,4vw,58px)/1.06 var(--serif);text-wrap:balance;max-width:14em}
.stars-copy p{max-width:32rem;color:rgba(245,247,252,.88)}
.count{font:400 clamp(56px,7vw,104px)/.9 var(--roman);text-align:right;white-space:nowrap}
.count small{display:block;font:400 14px/1.4 var(--sans);color:rgba(245,247,252,.75);margin-top:8px}
#constellation .day{font:500 13px var(--sans);fill:rgba(245,247,252,.78)}
#constellation .lnk{fill:none;stroke:rgba(245,247,252,.75);stroke-width:1.2}
#constellation .st{fill:var(--cloud);transition:r .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
#constellation .halo{fill:var(--gold-hi);opacity:0;transition:opacity .4s}
#constellation .on .halo{opacity:.35}

/* ---------- fresco (light) sections ---------- */
.fresco{background-color:var(--marble);color:var(--ink);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.fresco .wrap{padding-block:clamp(88px,12vw,160px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:clamp(40px,6vw,72px)}
.sec-head h2{margin:0;font:300 clamp(36px,4.6vw,68px)/1.04 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.sec-head p{color:var(--stone);max-width:34rem;font-size:17px}

.dirs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-stone)}
.dir{display:grid;grid-template-columns:64px minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1fr);gap:20px 32px;align-items:baseline;padding:28px 0;border-bottom:1px solid var(--rule-stone)}
.dir .lv{font:400 26px/1 var(--roman);color:#a3812f}
.dir h3{margin:0;font:400 clamp(24px,2.4vw,34px)/1.1 var(--serif)}
.dir p{color:#3b3d45;max-width:40ch}
.dir .tools{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--stone)}
.legend{margin-top:22px;font-size:14px;color:var(--stone)}
.legend b{font:400 18px var(--roman);color:#a3812f;font-weight:400}

.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(32px,6vw,96px)}
.level{display:grid;gap:18px;align-content:start}
.numeral{font:400 clamp(140px,19vw,260px)/.8 var(--roman);letter-spacing:.02em;
  background:linear-gradient(170deg,#f6e3a4 0%,#cf9f3f 38%,#8a6420 62%,#e3c06e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 10px 18px rgba(120,90,30,.18))}
.level h3{margin:0;font:400 clamp(26px,2.6vw,36px)/1.1 var(--serif)}
.level p{color:#3b3d45;max-width:36rem}
.level .now{font-size:15px;color:var(--cinnabar)}
.soon{margin-top:clamp(48px,6vw,80px);padding-top:24px;border-top:1px solid var(--rule-stone);color:var(--stone);max-width:52rem}
.soon b{color:var(--ink);font-weight:500}

/* ---------- honest (sky) ---------- */
.honest .wrap{padding-block:clamp(120px,16vw,220px)}
.honest h2{margin:0 0 28px;font:300 clamp(38px,5.4vw,84px)/1.04 var(--serif);letter-spacing:-.015em;max-width:14em;text-wrap:balance;text-shadow:0 2px 40px rgba(19,48,143,.45)}
.honest .lead{max-width:36rem;font-size:18px;color:rgba(245,247,252,.92);text-shadow:0 1px 20px rgba(19,48,143,.6)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:clamp(56px,8vw,96px)}
.fact{border-top:1px solid var(--rule-sky);padding-top:18px;display:grid;gap:8px;text-shadow:0 1px 18px rgba(19,48,143,.6)}
.fact h3{margin:0;font:400 22px/1.2 var(--serif)}
.fact p{font-size:15px;color:rgba(245,247,252,.86)}

/* ---------- faq ---------- */
.faq-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,96px);align-items:start}
.faq-grid h2{margin:0;font:300 clamp(36px,4.6vw,68px)/1.04 var(--serif);position:sticky;top:120px;text-wrap:balance}
details{border-top:1px solid var(--rule-stone)}
details:last-child{border-bottom:1px solid var(--rule-stone)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 0;font:400 21px/1.35 var(--serif)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:12px;height:12px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg) translate(-3px,-3px);transition:transform .3s}
details[open] summary::after{transform:rotate(225deg) translate(-3px,-3px)}
details p{padding:0 0 24px;color:#3b3d45;max-width:58ch}

/* ---------- final ---------- */
.final{min-height:100vh;display:flex;align-items:flex-end}
.final .wrap{display:grid;justify-items:center;text-align:center;gap:22px;padding-block:48vh 12vh}
.mark{font:400 clamp(64px,13vw,200px)/.9 var(--roman);letter-spacing:.01em;text-shadow:0 4px 60px rgba(19,48,143,.55)}
.final h2{margin:0;font:300 clamp(26px,3vw,40px)/1.15 var(--serif)}
.final p{max-width:34rem;color:rgba(245,247,252,.9);text-shadow:0 1px 20px rgba(19,48,143,.6)}
.handle{font-size:14px;color:rgba(245,247,252,.75);user-select:all}

footer{background:var(--lapis-deep);color:rgba(245,247,252,.75);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-block:28px calc(28px + env(safe-area-inset-bottom, 0px))}
footer a{text-decoration:none}
footer a:hover{color:#fff}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .nav-links{display:none}
  .hero{align-items:flex-end}
  .hero .wrap{grid-template-columns:1fr;padding-block:52vh 48px}
  .hero-copy{gap:20px}
  .hero .sub{font-size:16px}
  .sec-head,.faq-grid,.levels{grid-template-columns:1fr}
  .faq-grid h2{position:static}
  .dir{grid-template-columns:44px minmax(0,1fr);padding:22px 0}
  .dir p,.dir .tools{grid-column:2}
  .facts{grid-template-columns:1fr;gap:20px}
  .stars-copy .wrap{grid-template-columns:1fr;gap:10px}
  .stars-copy p{font-size:14px}
  .count{text-align:left;font-size:48px}
  .count small{display:inline;margin-left:8px}
  .final .wrap{padding-block:54vh 10vh}
}
@media (max-width:520px){
  .nav-in{padding-left:16px;gap:10px}
  .nav-in .btn.sm{display:none}
  .actions .btn{flex:1 1 100%}
}
.no-gl #sky{display:none}
.no-gl body,.no-gl{background:linear-gradient(#173cb8,#3f78e6 70%,#9cbcf3)}
@media (prefers-reduced-motion: reduce){ .btn,#constellation .st,#constellation .halo{transition:none} }
</style>
</head>
<body>

</main>

<footer>

    <span data-i18n="foot"></span>
    <a href="https://www.instagram.com/gulhayo.ai/" target="_blank" rel="noopener">Instagram @gulhayo.ai</a>

/* ---------- constellation (SVG, scroll-driven) ---------- */
const svg=$('#constellation'), countN=$('#countN'), NS='http://www.w3.org/2000/svg';
let stars=[], segLen=[], totalLen=0, pathEl=null;
function buildStars(){
  const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight, narrow=w<760;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.innerHTML='';
  const days=I18N.t('days'), pts=[];
  // a gentle winding path, two stars per day
  for(let d=0;d<7;d++){
    let x,y,x2,y2;
    if(!narrow){
      const left=w*.08, span=w*.84, cx=left+span*(d+.5)/7;
      const base=h*.66+Math.sin(d*1.15+.4)*h*.1;
      x=cx-span/7*.22; y=base+Math.cos(d*2.1)*h*.05; x2=cx+span/7*.2; y2=base-h*.07+Math.sin(d*1.7)*h*.04;
    }else{
      const top=h*.5, span=h*.44, cy=top+span*(d+.5)/7;
      const base=w*.5+Math.sin(d*1.2+.3)*w*.18;
      x=base-w*.12; y=cy-span/7*.18; x2=base+w*.12; y2=cy+span/7*.18;
    }
    pts.push({x,y,d},{x:x2,y:y2,d});
  }
  pathEl=document.createElementNS(NS,'polyline');
  pathEl.setAttribute('class','lnk'); pathEl.setAttribute('points',pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '));
  svg.appendChild(pathEl);
  segLen=[0]; for(let i=1;i<pts.length;i++) segLen.push(segLen[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  totalLen=segLen[segLen.length-1];
  pathEl.style.strokeDasharray=totalLen; pathEl.style.strokeDashoffset=totalLen;

    const g=document.createElementNS(NS,'g');
    const halo=document.createElementNS(NS,'circle'); halo.setAttribute('class','halo'); halo.setAttribute('cx',p.x); halo.setAttribute('cy',p.y); halo.setAttribute('r',14);
    const s=document.createElementNS(NS,'circle'); s.setAttribute('class','st'); s.setAttribute('cx',p.x); s.setAttribute('cy',p.y); s.setAttribute('r',2.2);
    g.appendChild(halo); g.appendChild(s); svg.appendChild(g); return {g,s};
  });

    else{tx.setAttribute('x',Math.min(a.x,b.x)-26); tx.setAttribute('y',(a.y+b.y)/2+4);}
    tx.textContent=days[d]; svg.appendChild(tx);
  }
  lastLit=-1;
}
let lastLit=-1;
function updateStars(){

    for(let k=0;k<6;k++){x+=(rnd()-.35)*260; y+=(rnd()-.5)*200; g.quadraticCurveTo(x+(rnd()-.5)*120,y+(rnd()-.5)*120,x,y);}
    g.strokeStyle=`rgba(${120+rnd()*40|0},${116+rnd()*30|0},${110+rnd()*30|0},${.06+rnd()*.12})`;
    g.lineWidth=.6+rnd()*2.4; g.shadowColor='rgba(110,100,90,.35)'; g.shadowBlur=4+rnd()*8; g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
const marble=new THREE.MeshStandardMaterial({map:marbleTex(),roughness:.42,metalness:0,color:0xffffff});

// fluted column with a Doric capital
const column=new THREE.Group(); rig.add(column);
(function(){
  const shaft=new THREE.CylinderGeometry(.74,.8,8,144,24,true);
  const pos=shaft.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), a=Math.atan2(z,x), r=Math.hypot(x,z);
    const k=1-.045*Math.pow(.5+.5*Math.cos(a*20),.6);
    pos.setX(i,x/r*r*k); pos.setZ(i,z/r*r*k);
  }
  shaft.computeVertexNormals();
  const m=new THREE.Mesh(shaft,marble); m.position.y=-4; column.add(m);
  const prof=[[.74,0],[.8,.04],[.92,.14],[1.02,.24],[1.05,.28],[0,.28]].map(p=>new THREE.Vector2(p[0],p[1]));
  const ech=new THREE.Mesh(new THREE.LatheGeometry(prof,96),marble); column.add(ech);
  const neck=new THREE.Mesh(new THREE.TorusGeometry(.76,.035,12,96),marble); neck.rotation.x=Math.PI/2; neck.position.y=-.06; column.add(neck);
  const abacus=new THREE.Mesh(new THREE.BoxGeometry(2.25,.2,2.25),marble); abacus.position.y=.38; column.add(abacus);
})();

// golden laurel wreath with a cinnabar ribbon
const gold=new THREE.MeshStandardMaterial({color:0xc48a22,metalness:1,roughness:.3,envMapIntensity:1});
const wreath=new THREE.Group(); rig.add(wreath);
(function(){
  const R=1.18, leafGeo=new THREE.SphereGeometry(1,14,10);
  const PAIRS=15, total=2*(PAIRS*2+1);
  const leaves=new THREE.InstancedMesh(leafGeo,gold,total); let n=0;
  const berries=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,8),gold,2*6); let nb=0;
  const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), E=new THREE.Euler(), S=new THREE.Vector3(), P=new THREE.Vector3();
  [-1,1].forEach(side=>{
    const pt=s=>{const a=-Math.PI/2+side*s*Math.PI*.86;return new THREE.Vector3(R*Math.cos(a),R*Math.sin(a),0);};
    const curve=new THREE.CatmullRomCurve3(Array.from({length:24},(_,i)=>pt(i/23)));
    wreath.add(new THREE.Mesh(new THREE.TubeGeometry(curve,80,.022,8,false),gold));
    const leaf=(at,dir,size,tilt)=>{
      const L=.27*size; P.copy(at).addScaledVector(dir,L*.92);
      E.set(tilt,0,Math.atan2(dir.y,dir.x)-Math.PI/2); Q.setFromEuler(E);
      S.set(.085*size,L,.03*size); M.compose(P,Q,S); leaves.setMatrixAt(n++,M);
    };
    for(let k=0;k<PAIRS;k++){
      const s=.04+k*(.9/PAIRS), at=pt(s), ahead=pt(s+.01), tan=ahead.clone().sub(at).normalize();
      const outN=at.clone().normalize(), size=1-.42*(k/PAIRS);
      const o=tan.clone().multiplyScalar(.62).addScaledVector(outN,.78).normalize();
      const i=tan.clone().multiplyScalar(.62).addScaledVector(outN,-.78).normalize();
      leaf(at,o,size,.35*side); leaf(pt(s+.025),i,size*.94,-.35*side);
      if(k%3===1&&nb<12){P.copy(at).addScaledVector(outN,.06).addScaledVector(tan,.05);P.z=.06;S.setScalar(.042);M.compose(P,new THREE.Quaternion(),S);berries.setMatrixAt(nb++,M);}
    }
    const end=pt(.93), tan=pt(.94).sub(end).normalize(); leaf(end,tan,.6,0);
  });
  leaves.count=n; berries.count=nb;
  wreath.add(leaves,berries);
  // ribbon knot + tails
  const silk=new THREE.MeshStandardMaterial({color:0x9e2219,roughness:.55,metalness:.05,side:THREE.DoubleSide});
  const knot=new THREE.Mesh(new THREE.SphereGeometry(.07,20,14),silk); knot.scale.set(1.1,1,.8); knot.position.set(0,-R,.04); wreath.add(knot);
  function ribbon(pts,w){
    const curve=new THREE.CatmullRomCurve3(pts), N=48, v=[], idx=[];
    for(let i=0;i<=N;i++){
      const t=i/N, p=curve.getPoint(t), tg=curve.getTangent(t), side=new THREE.Vector3().crossVectors(tg,new THREE.Vector3(0,0,1)).normalize();
      const tw=Math.sin(t*Math.PI*1.4)*.7; side.applyAxisAngle(tg,tw);
      const ww=w*(1-.25*t);
      v.push(p.x+side.x*ww,p.y+side.y*ww,p.z+side.z*ww,p.x-side.x*ww,p.y-side.y*ww,p.z-side.z*ww);
      if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
    return new THREE.Mesh(g,silk);
  }
  wreath.add(ribbon([new THREE.Vector3(0,-R,.05),new THREE.Vector3(-.18,-R-.22,.12),new THREE.Vector3(-.1,-R-.45,.06),new THREE.Vector3(-.26,-R-.68,.1)],.07));
  wreath.add(ribbon([new THREE.Vector3(0,-R,.05),new THREE.Vector3(.2,-R-.2,.1),new THREE.Vector3(.16,-R-.42,.14),new THREE.Vector3(.32,-R-.62,.08)],.07));
  [-1,1].forEach(sd=>{const loop=new THREE.Mesh(new THREE.TorusGeometry(.1,.032,10,28),silk);loop.scale.set(1.25,.75,.6);loop.position.set(sd*.13,-R+.02,.05);loop.rotation.z=sd*.35;wreath.add(loop);});
})();

/* ---------- camera states ---------- */
const WY=2.35; // wreath centre height above the capital
let narrow=false;
const stateA={cam:new THREE.Vector3(),look:new THREE.Vector3(),rigX:0,rigY:0,colY:0,sway:1,scale:1};
function heroState(pd){
  const rx=narrow?0:2.55, ry=narrow?1.15:0;
  const start=narrow?new THREE.Vector3(0,1.6,12.5):new THREE.Vector3(.2,1.45,10.4);
  const lookS=narrow?new THREE.Vector3(0,1.6,0):new THREE.Vector3(.2,1.3,0);
  const ctr=new THREE.Vector3(rx,WY+ry,0);
  const a=ease(clamp01(pd/.6)), z=pd<.6?mix(start.z,3.2,ease(pd/.6)):mix(3.2,-6,ease((pd-.6)/.4));
  stateA.cam.set(mix(start.x,ctr.x,a),mix(start.y,ctr.y,a),z);
  stateA.look.set(mix(lookS.x,ctr.x,a),mix(lookS.y,ctr.y,a),mix(0,-20,clamp01((pd-.35)/.4)));
  stateA.rigX=rx; stateA.rigY=ry; stateA.colY=narrow?-40:0; stateA.sway=1-a; stateA.scale=narrow?.82:1;
  return stateA;
}
function finalState(){
  // wreath sits in the top quarter, above the wordmark
  const z=narrow?11:8.4, half=z*Math.tan(THREE.MathUtils.degToRad(16));
  stateA.cam.set(0,WY,z); stateA.look.set(0,WY-half*.52,0);
  stateA.rigX=0; stateA.rigY=0; stateA.colY=-40; stateA.sway=1; stateA.scale=narrow?.62:.56;
  return stateA;
}

/* ---------- loop ---------- */
let visibleZones=new Set();
const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?visibleZones.add(e.target):visibleZones.delete(e.target));},{rootMargin:'2px'});
document.querySelectorAll('.sky-zone').forEach(z=>io.observe(z));

function resize(){
  const w=innerWidth,h=innerHeight; narrow=w/h<.95||w<760;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  skyU.uRes.value.set(w*DPR,h*DPR);
}
addEventListener('resize',resize); resize();

const camPos=new THREE.Vector3(), camLook=new THREE.Vector3(); let first=true, last=performance.now(), smooth={sx:0,sy:0,cy:0,sw:1,sc:1};
function frame(now){
  requestAnimationFrame(frame);
  if(!visibleZones.size && !first) return;
  const t=RM?0:now/1000, dt=Math.min(.1,(now-last)/1000); last=now;
  skyU.uTime.value=t; skyU.uScroll.value=scrollY/innerHeight;
  const finalTop=$('#join').getBoundingClientRect().top;
  const dive=$('#dive'), pd=clamp01(scrollY/(dive.offsetTop+dive.offsetHeight-innerHeight));
  const st=finalTop<innerHeight*1.02?finalState():heroState(pd);
  const k=first?1:1-Math.exp(-dt*9);
  camPos.lerp(st.cam,k); camLook.lerp(st.look,k);
  if(first){camPos.copy(st.cam);camLook.copy(st.look);}
  smooth.sx=mix(smooth.sx,st.rigX,k); smooth.sy=mix(smooth.sy,st.rigY,k); smooth.cy=mix(smooth.cy,st.colY,first?1:1-Math.exp(-dt*12)); smooth.sw=mix(smooth.sw,st.sway,k); smooth.sc=mix(smooth.sc,st.scale,k);
  if(Math.abs(smooth.cy-st.colY)>20) smooth.cy=st.colY;
  rig.position.set(smooth.sx,smooth.sy,0);
  column.position.y=smooth.cy;
  wreath.position.set(0,WY,0); wreath.scale.setScalar(smooth.sc);
  wreath.rotation.set(-.08*smooth.sw,(Math.sin(t*.35)*.5+.25)*smooth.sw,Math.sin(t*.5)*.03*smooth.sw);
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.clear(); renderer.render(skyScene,orthoCam); renderer.clearDepth(); renderer.render(scene,camera);
  first=false;
}
requestAnimationFrame(frame);
})();
</script>
</body>
